<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="description" content="Interactive 360° site inductions and HSE training that run in any browser.">
  <title>HQscale — 360° Site Induction</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="stage" class="stage"></div>

  <!-- Top bar (during a scenario) -->
  <header id="topbar" class="topbar" hidden>
    <button id="btn-exit" class="icon-btn" aria-label="Exit to menu" title="Exit">✕</button>
    <div class="topbar-mid">
      <div id="scene-title" class="scene-title"></div>
      <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
    <div class="topbar-right">
      <span id="step-count" class="step-count"></span>
      <button id="btn-video" class="icon-btn" aria-label="Play or pause video" title="Play / pause" hidden>⏯</button>
      <button id="btn-gyro" class="icon-btn" aria-label="Look around by moving your phone" title="Motion look" hidden>🧭</button>
      <button id="btn-fullscreen" class="icon-btn" aria-label="Full screen" title="Full screen" hidden>⛶</button>
    </div>
  </header>

  <!-- Task banner (find / explore prompts) -->
  <div id="banner" class="banner" hidden role="status" aria-live="polite"></div>

  <!-- Bottom card (info, quiz, feedback) -->
  <section id="card" class="card" hidden aria-live="polite"></section>
  <button id="btn-restore-card" class="pill-btn restore-card" hidden>Back to question ▴</button>

  <!-- Home screen -->
  <section id="home" class="screen">
    <div class="screen-inner">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="44" height="44">
        <div>
          <h1>HQscale</h1>
          <p class="muted">360° site induction &amp; HSE training</p>
        </div>
      </div>
      <label class="field">
        <span>Your name <span class="muted">(optional, shown on your results)</span></span>
        <input id="learner-name" type="text" autocomplete="name" placeholder="e.g. Sam Taylor">
      </label>
      <h2 class="section-label">Choose a module</h2>
      <div id="module-list" class="module-list"><p class="muted">Loading modules…</p></div>
      <p class="footnote muted">Works on phones, tablets and laptops. Drag to look around, pinch or scroll to zoom.
        <a href="#author">Authoring tool</a></p>
    </div>
  </section>

  <!-- Results -->
  <section id="results" class="screen" hidden>
    <div class="screen-inner" id="results-inner"></div>
  </section>

  <!-- Author mode toolbar -->
  <section id="author" class="author" hidden></section>

  <div id="loading" class="loading" hidden><div class="spinner"></div><span>Loading scene…</span></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:2rem;color:#fff">Please enable JavaScript to use this training.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
